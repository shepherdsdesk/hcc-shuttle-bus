<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HCC 셔틀버스 · 운행 현황판</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0B1220">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root{--navy:#1B2B5C;--teal:#0F766E;--bg:#0B1220;--card:#131C2E;--line:#1F2A40;--sub:#94A3B8;--y:#93C5FD;--p:#5EEAD4;--amber:#F59E0B;--ink:#F8FAFC;--chip:#1E293B;--deco:#93C5FD}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);transition:background .6s,color .6s;font-family:"Pretendard Variable",Pretendard,"Noto Sans KR",system-ui,sans-serif;letter-spacing:-.02em;overflow:hidden}
  body.idle{cursor:none}
  .tv{height:100vh;display:flex;flex-direction:column;gap:1.2vmin;padding:1.6vmin 1.8vmin}
  .tv>.main{flex:1}
  header{display:flex;align-items:center;gap:1.6vmin}
  .logo{width:6vmin;height:6vmin;border-radius:1.6vmin;background:var(--navy);display:grid;place-items:center;border:.25vmin solid var(--line)}
  .logo svg{width:58%;height:58%}
  header h1{margin:0;font-size:3.6vmin;font-weight:900;line-height:1.1}
  header small{display:block;font-size:1.9vmin;color:var(--sub);font-weight:600}
  .live{display:flex;align-items:center;gap:1vmin;font-size:2vmin;font-weight:800;color:#FCA5A5;margin-left:2vmin}
  .live i{width:1.4vmin;height:1.4vmin;border-radius:50%;background:#EF4444}
  .live.ok{color:#86EFAC}.live.ok i{background:#22C55E;animation:lp 1.6s infinite}
  @keyframes lp{0%{box-shadow:0 0 0 0 rgba(34,197,94,.6)}70%{box-shadow:0 0 0 1.4vmin rgba(34,197,94,0)}100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}}
  .clock{margin-left:auto;text-align:right}
  .clock b{display:block;font-size:5.4vmin;font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
  .clock span{font-size:1.9vmin;color:var(--sub);font-weight:700}
  .notice{display:flex;gap:1.2vmin;align-items:center;background:#2A1C08;border:.25vmin solid #8A5A12;color:#FCD34D;border-radius:1.6vmin;padding:1.2vmin 2vmin;font-size:2.6vmin;font-weight:800}
  .main{display:grid;grid-template-columns:1.25fr 1fr .8fr;grid-template-areas:"map boards times";gap:1.6vmin;min-height:0}
  .mapbox{grid-area:map}.boards{grid-area:boards}.times{grid-area:times}
  /* 시간표 */
  .times{background:var(--cardA,var(--card));border:.2vmin solid var(--line);border-radius:2vmin;padding:1.2vmin 1.8vmin;display:flex;flex-direction:column;gap:1vmin;overflow:hidden;min-height:0}
  .times>h2{margin:0;display:flex;align-items:baseline;gap:1vmin;font-size:2.7vmin;font-weight:900}
  .times>h2 small{margin-left:auto;font-size:1.8vmin;color:var(--sub);font-weight:700}
  .ttr{display:flex;flex-direction:column;gap:.6vmin;padding-top:.9vmin;border-top:.15vmin solid var(--line)}
  .ttr h3{margin:0;display:flex;align-items:center;gap:1vmin;font-size:2.1vmin;font-weight:900}
  .ttr h3 i{width:1.6vmin;height:1.6vmin;border-radius:.4vmin}
  .ttl{display:flex;flex-direction:column;gap:.5vmin}
  .ttl .lab{font-size:1.75vmin;color:var(--sub);font-weight:800}
  .chips{display:flex;flex-wrap:wrap;gap:.6vmin}
  .chips b{background:var(--chip);color:var(--ink);border-radius:.8vmin;padding:.4vmin 1vmin;font-size:2.2vmin;font-weight:800;font-variant-numeric:tabular-nums}
  .chips b.first{background:var(--navy);color:#fff;box-shadow:0 0 0 .25vmin #93C5FD}
  .ttr.park .chips b.first{background:var(--teal);box-shadow:0 0 0 .25vmin #5EEAD4}
  .chips .none{font-size:1.9vmin;color:#64748B;font-weight:700}
  /* 화면 방향 고르기 */
  .ctl{position:fixed;left:50%;bottom:1.4vmin;transform:translateX(-50%);z-index:2000;display:flex;gap:1vmin;align-items:center;background:rgba(11,18,32,.92);border:.2vmin solid var(--line);border-radius:1.4vmin;padding:.8vmin;transition:opacity .3s}
  .ctl button{white-space:nowrap;border:0;background:var(--chip);color:var(--ink);border-radius:1vmin;padding:1vmin 1.5vmin;font:inherit;font-size:1.8vmin;font-weight:800;cursor:pointer}
  .ctl button.on{background:#F59E0B;color:#0B1220}
  .ctl button:focus-visible{outline:.4vmin solid #FCD34D;outline-offset:.2vmin}
  .ctl span{white-space:nowrap;font-size:1.6vmin;color:var(--sub);font-weight:700;margin:0 .4vmin 0 1vmin}
  body.idle .ctl{opacity:0;pointer-events:none}
  /* TV를 세로로 세웠는데 화면이 가로로 나올 때: 화면을 90도 돌림 */
  body.rot-r .tv,body.rot-l .tv{position:fixed;width:100vh;height:100vw;transform-origin:0 0}
  body.rot-r .tv{top:0;left:100vw;transform:rotate(90deg)}
  body.rot-l .tv{top:100vh;left:0;transform:rotate(-90deg)}
  .mapbox{position:relative;border-radius:2vmin;overflow:hidden;border:.2vmin solid var(--line);min-height:0}
  #map{position:absolute;inset:0;background:#111A2B}
  #map .leaflet-tile-pane,#map.is-kakao img{filter:invert(1) hue-rotate(180deg) brightness(.82) contrast(.92)}
  .legend{position:absolute;left:1.2vmin;bottom:1.2vmin;z-index:900;display:flex;gap:1.4vmin;align-items:center;background:rgba(11,18,32,.86);border:.2vmin solid var(--line);border-radius:1.2vmin;padding:.9vmin 1.4vmin;font-size:1.7vmin;font-weight:700;color:#CBD5E1}
  .legend span{display:inline-flex;align-items:center;gap:.7vmin}
  .legend i{width:1.6vmin;height:1.6vmin;border-radius:.4vmin;display:inline-block}
  .boards{display:flex;flex-direction:column;gap:1.6vmin;min-height:0}
  .rt{flex:1;min-height:0;background:var(--cardA,var(--card));border:.2vmin solid var(--line);border-radius:2vmin;padding:1.2vmin 1.8vmin;display:flex;flex-direction:column;gap:.4vmin;overflow:hidden}
  .rt h2{margin:0 0 .3vmin;display:flex;align-items:center;gap:1.2vmin;font-size:2.7vmin;font-weight:900}
  .rt h2 .sw{width:2vmin;height:2vmin;border-radius:.5vmin}
  .rt h2 small{margin-left:auto;font-size:1.9vmin;color:var(--sub);font-weight:700}
  .stop{display:flex;align-items:center;gap:1.6vmin;padding:.75vmin 0;border-top:.15vmin solid var(--line)}
  .stop:first-of-type{border-top:0}
  .stop .nm{flex:1;min-width:0}
  .stop .nm b{display:block;font-size:2.4vmin;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .stop .nm span{font-size:1.6vmin;color:var(--sub);font-weight:600}
  .eta{text-align:right;white-space:nowrap}
  .eta b{font-size:4vmin;font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
  .eta b small{font-size:2.2vmin;font-weight:800;margin-left:.3vmin}
  .eta span{display:block;font-size:1.55vmin;color:var(--sub);font-weight:700;margin-top:.2vmin}
  .eta.soon b{color:#FCA5A5}
  .eta.sch b{font-size:2.9vmin;color:var(--ink);opacity:.85}
  .eta.none b{font-size:2.3vmin;color:#64748B}
  .next{margin-top:auto;display:flex;align-items:center;gap:.8vmin;flex-wrap:wrap;font-size:1.7vmin;color:var(--sub);font-weight:700;padding-top:.8vmin;border-top:.15vmin solid var(--line)}
  .next b{background:var(--chip);color:var(--ink);border-radius:.8vmin;padding:.35vmin 1vmin;font-size:2.05vmin;font-variant-numeric:tabular-nums}
  .next b.first{background:var(--navy);color:#fff}
  .rt.park .next b.first{background:var(--teal)}
  /* 교회 소식 자막 */
  .ticker{display:flex;align-items:stretch;background:var(--card);border:.2vmin solid var(--line);border-radius:1.4vmin;overflow:hidden;height:5.6vmin;flex:none}
  .ticker .tag{flex:none;display:flex;align-items:center;gap:.8vmin;background:var(--navy);color:#fff;font-size:2.2vmin;font-weight:900;padding:0 2vmin;white-space:nowrap}
  .ticker .tag i{width:1.2vmin;height:1.2vmin;border-radius:50%;background:#FCD34D}
  .tk-view{position:relative;flex:1;overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent,#000 3%,#000 97%,transparent);mask-image:linear-gradient(90deg,transparent,#000 3%,#000 97%,transparent)}
  .tk-track{position:absolute;top:0;bottom:0;left:0;display:flex;align-items:center;white-space:nowrap;will-change:transform;animation:tk linear infinite}
  .tk-track span{font-size:2.6vmin;font-weight:800;color:var(--ink);padding-right:8vmin}
  .tk-track span::before{content:"●";color:var(--deco);font-size:1.4vmin;margin-right:1.4vmin;vertical-align:.4vmin}
  @keyframes tk{from{transform:translateX(0)}to{transform:translateX(-50%)}}
  footer{display:flex;align-items:center;gap:1.6vmin;color:var(--sub);font-size:1.8vmin;font-weight:600;flex:none}
  footer .ftxt{min-width:0}
  footer .ftxt span{display:block;white-space:nowrap}
  footer .ftxt .site{font-size:1.5vmin;opacity:.75;margin-top:.2vmin}
  footer .qr{background:#fff;border-radius:1vmin;padding:.6vmin;width:8.5vmin;height:8.5vmin}
  footer .qr svg{width:100%;height:100%;display:block}
  footer b{color:var(--ink);font-size:2.3vmin;display:block}
  footer .credit{margin-left:auto;text-align:right;white-space:nowrap}
  footer .credit .tel{display:block;font-size:2.6vmin;font-weight:900;color:var(--ink)}
  footer .credit .tel em{font-style:normal;font-size:1.7vmin;color:var(--sub);font-weight:700;margin-right:.8vmin}
  footer .credit small{display:block;font-size:1.25vmin;opacity:.4;margin-top:.3vmin}
  body.portrait footer .credit .tel{font-size:3.4vmin}
  /* 지도 표시 */
  .mkc{position:absolute;left:0;top:0;transform:translate(-50%,-50%)}
  .pill{display:inline-flex;align-items:center;gap:.6vmin;white-space:nowrap;font-size:2.1vmin;font-weight:900;padding:.6vmin 1.3vmin .6vmin .7vmin;border-radius:999px;box-shadow:0 .4vmin 1.4vmin rgba(0,0,0,.5);border:.3vmin solid #0B1220;color:#fff}
  .pill .n{width:2.8vmin;height:2.8vmin;border-radius:50%;background:#fff;display:inline-grid;place-items:center;font-size:1.8vmin}
  .pill.out{background:#0B1220!important}
  .pill.out .n{color:#fff}
  .pill.old{opacity:.45}
  .pill svg{width:2vmin;height:2vmin}
  .stopmk{position:relative;width:2.4vmin;height:2.4vmin;border-radius:50%;background:#0B1220;border:.6vmin solid var(--y);box-sizing:border-box}
  .stoplab{position:absolute;bottom:calc(100% + .7vmin);left:50%;transform:translateX(-50%);white-space:nowrap;background:rgba(11,18,32,.9);border:.15vmin solid var(--line);font-size:1.7vmin;font-weight:800;padding:.3vmin .9vmin;border-radius:.8vmin;color:#E2E8F0}
  /* 제목 띠 (장식 · 사진) */
  header{position:relative}
  header>*:not(.hdbg){position:relative;z-index:1}
  .hdbg{display:none;position:absolute;inset:0;border-radius:2vmin;overflow:hidden;z-index:0;background:var(--cardA,var(--card));border:.2vmin solid var(--line)}
  body.band header{padding:1.2vmin 1.8vmin}
  body.band .hdbg{display:block}
  .hdbg .ph{position:absolute;inset:0;background-size:cover;background-position:center}
  .hdbg .ph::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,var(--card) 0,var(--card) 22%,transparent 55%,transparent 72%,var(--card) 94%)}
  body.portrait .hdbg .ph::after{background:linear-gradient(90deg,var(--card) 0,var(--card) 30%,transparent 62%,var(--card) 100%)}
  .hdeco{margin-left:auto;height:8.5vmin;width:38vmin;color:var(--deco);opacity:.6}
  .hdeco:empty{display:none}
  header h1,.live,.clock b,.clock span{white-space:nowrap}
  body.portrait.band header h1{font-size:3.5vmin}
  body.portrait .clock b{font-size:4.8vmin}
  .hdeco:not(:empty)+.clock{margin-left:2vmin}
  body.portrait .hdeco{width:16vmin;opacity:.5}
  .hdeco svg{width:100%;height:100%;display:block}
  /* 밝은 테마 */
  body.light .live{color:#B91C1C}
  body.light .live.ok{color:#15803D}
  body.light #map .leaflet-tile-pane, body.light #map.is-kakao img{filter:none}
  body.light #map{background:#E5E7EB}
  body.light .legend{background:rgba(255,255,255,.92);color:#334155}
  body.light .stopmk{background:#fff}
  body.light .stoplab{background:rgba(255,255,255,.95);color:#0F172A}
  body.light .pill{border-color:#fff}
  body.light .pill.out{background:#fff!important;color:#14213D!important}
  body.light .eta.soon b{color:#DC2626}
  body.light .notice{background:#FFF7E6;border-color:#F3C77A;color:#92400E}
  body.light .ctl{background:rgba(255,255,255,.95)}
  body.light .chips .none,body.light .eta.none b{color:#94A3B8}
  /* 자막 빛줄기 · 강조 */
  .ticker{position:relative}
  .ticker .shine{position:absolute;top:0;bottom:0;left:0;width:22%;pointer-events:none;background:linear-gradient(105deg,transparent 0%,var(--shine,rgba(255,255,255,.35)) 50%,transparent 100%);opacity:0;transform:translateX(-120%);animation:shine 7s ease-in-out infinite;will-change:transform}
  @keyframes shine{0%{transform:translateX(-120%);opacity:0}3%{opacity:1}16%{transform:translateX(560%);opacity:1}17%,100%{transform:translateX(560%);opacity:0}}
  .ticker .tag i{animation:dotp 7s ease-in-out infinite}
  @keyframes dotp{0%,1%{transform:scale(1);box-shadow:none}5%{transform:scale(1.7);box-shadow:0 0 1.4vmin var(--deco)}11%,100%{transform:scale(1);box-shadow:none}}
  .tk-track span.hi{color:#FCD34D}
  body.light .tk-track span.hi{color:#B45309}
  .tk-track b.imp{display:inline-block;font-size:1.8vmin;font-weight:900;color:#0B1220;background:#F59E0B;border-radius:.6vmin;padding:.2vmin .9vmin;margin-right:1.2vmin;vertical-align:.3vmin}
  /* 날씨 */
  .hright{margin-left:auto;display:flex;align-items:center;gap:2.4vmin}
  .hright .clock{margin-left:0}
  .wx{display:flex;align-items:center;gap:1.2vmin;white-space:nowrap}
  .wx .wi{width:5.2vmin;height:5.2vmin;flex:none}
  .wx .wi svg{width:100%;height:100%;display:block}
  .wx b{display:block;font-size:4.2vmin;font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
  .wx .wt{display:flex;flex-direction:column;gap:.3vmin}
  .wx .wd{font-size:1.75vmin;color:var(--sub);font-weight:700}
  .wx .wd i{font-style:normal;color:var(--ink)}
  .wx .pm{display:inline-block;border-radius:.6vmin;padding:0 .7vmin;font-weight:800;color:#0B1220}
  body.portrait .wx .wd.d2{display:none}
  body.portrait .wx b{font-size:3.6vmin}
  /* 계절 효과: 카드 뒤에서만 */
  .fx{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
  .tv{position:relative;z-index:1}
  .fx .f{position:absolute;top:-10vh;animation:fxfall linear infinite}
  .fx .f>span{display:block;animation:fxsway ease-in-out infinite alternate}
  .fx .f svg{display:block;width:100%;height:100%}
  @keyframes fxfall{from{transform:translateY(-10vh)}to{transform:translateY(120vh)}}
  @keyframes fxsway{from{transform:translateX(calc(var(--sw) * -1)) rotate(calc(var(--rt) * -1))}to{transform:translateX(var(--sw)) rotate(var(--rt))}}
  .fx .w{position:absolute;left:0;animation:fxwind linear infinite;opacity:0}
  @keyframes fxwind{0%{transform:translateX(-40vw);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translateX(120vw);opacity:0}}
  @media (prefers-reduced-motion:reduce){ .fx{display:none} .ticker .shine,.ticker .tag i{animation:none} }
  .hide{display:none!important}
  .toast{display:none}
  /* 세로 화면 */
  body.portrait .main{grid-template-columns:1fr;grid-template-rows:32% 1fr auto;grid-template-areas:"map" "boards" "times"}
  body.portrait header h1{font-size:4vmin}
  body.portrait .times>h2{font-size:3vmin}
  body.portrait .ttr{flex-direction:row;gap:2vmin}
  body.portrait .ttr h3{min-width:22vmin;align-self:flex-start;padding-top:.4vmin}
  body.portrait .ttr .ttls{flex:1;display:flex;flex-direction:column;gap:.8vmin}
  /* 노선 하나만 보여 줄 때 (tv.html?route=yatap) */
  body.one .rt{flex:1}
.stop .nm .wc{font-style:normal;display:inline-block;margin-left:.6vmin;padding:.1vmin .9vmin;border-radius:99vmin;background:#F59E0B;color:#fff;font-weight:800;font-size:1.5vmin;white-space:nowrap}
/* ===== 한 노선(평일) · 운행 없는 날(포스터) 화면 ===== */
.nextbox{grid-area:next;background:var(--cardA,var(--card));border:.2vmin solid var(--line);border-radius:2vmin;padding:1.2vmin 1.8vmin;display:flex;flex-direction:column;gap:.8vmin;min-height:0}
.nextbox h2{margin:0;display:flex;align-items:baseline;gap:1vmin;font-size:2.8vmin;font-weight:900}
.nextbox h2 small{margin-left:auto;font-size:1.8vmin;color:var(--sub);font-weight:700}
.nxs{display:grid;grid-template-columns:repeat(auto-fit,minmax(24vmin,1fr));gap:1.2vmin}
.nx{background:var(--chip);border-radius:1.6vmin;padding:1.2vmin 1.6vmin;display:grid;grid-template-columns:auto 1fr;grid-template-areas:"lab lab" "t in" "sm sm";align-items:baseline;column-gap:1.4vmin}
.nx .lab{grid-area:lab;font-size:1.9vmin;color:var(--sub);font-weight:800}
.nx b{grid-area:t;font-size:6.2vmin;font-weight:900;line-height:1.05;font-variant-numeric:tabular-nums}
.nx em{grid-area:in;font-style:normal;font-size:2.6vmin;font-weight:900;color:#FCD34D;white-space:nowrap}
.nx small{grid-area:sm;font-size:1.8vmin;color:var(--sub);font-weight:700}
.nx.done b{font-size:3.6vmin;color:#64748B}
body.light .nx em{color:#B45309}
.poster{grid-area:poster;position:relative;border-radius:2vmin;overflow:hidden;background:#000;border:.2vmin solid var(--line);min-height:0}
.poster .pbg{position:absolute;inset:-6%;background-size:cover;background-position:center;filter:blur(3.5vmin) brightness(.45) saturate(1.2);transition:background-image 1s}
.poster .pslides{position:absolute;inset:1.2vmin}
.poster .pslides img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;transition:opacity 1.1s ease}
.poster .pslides img.on{opacity:1}
.pdots{position:absolute;bottom:1.4vmin;left:50%;transform:translateX(-50%);display:flex;gap:1vmin;background:rgba(0,0,0,.35);padding:.7vmin 1.1vmin;border-radius:99vmin}
.pdots:empty{display:none}
.pdots i{width:1.3vmin;height:1.3vmin;border-radius:50%;background:rgba(255,255,255,.45)}
.pdots i.on{background:#fff;transform:scale(1.25)}
/* 한 노선 (가로) */
body.one:not(.rest) .main{grid-template-columns:1.15fr 1fr .8fr;grid-template-rows:auto minmax(0,1fr);grid-template-areas:"map boards times" "map next times"}
body.one.pal:not(.rest) .main{grid-template-columns:1.1fr 1fr .78fr;grid-template-rows:auto minmax(0,1fr);grid-template-areas:"map boards poster" "map next poster"}
body.one.pal:not(.rest):not(.portrait) .times{display:none}
body.one:not(.rest):not(.portrait) .nx b{font-size:5.2vmin}
body.one .rt{padding:1.6vmin 2.2vmin}
body.one .rt h2{font-size:3.2vmin}
body.one .stop{padding:1vmin 0}
body.one .stop .nm b{font-size:3.2vmin}
body.one .stop .nm span{font-size:2.1vmin}
body.one .eta b{font-size:5.2vmin}
body.one .eta b small{font-size:3vmin}
body.one .eta span{font-size:2vmin}
body.one .eta.sch b{font-size:4.3vmin}
body.one .eta.none b{font-size:3.4vmin}
body.one .stop .nm .wc{font-size:2vmin}
body.one .chips b{font-size:2.6vmin}
/* 운행 없는 날 (가로): 포스터 60% + 다음 운행 안내 */
body.rest .main{grid-template-columns:1.55fr 1fr;grid-template-rows:minmax(0,1fr);grid-template-areas:"poster rest"}
body.rest .mapbox, body.rest .boards, body.rest .times, body.rest .nextbox{display:none!important}
body.rest.noposter .main{grid-template-columns:minmax(0,1fr);grid-template-areas:"rest"}

// ==== MAPKIT START ====  (카카오맵 / OpenStreetMap 공통 지도 — 이 블록은 index·driver·admin·tv에 똑같이 들어갑니다)
// 관리자 설정에 카카오 지도 키(config/kakaoKey)가 있으면 카카오맵, 없거나 불러오지 못하면 OpenStreetMap(Leaflet)을 씁니다.
const MapKit = (()=>{
  const dv=(v,d)=>v==null?d:v; // 오래된 TV 브라우저에서도 동작하도록
  let kakaoReady=null;
  function loadKakao(key){
    if(kakaoReady) return kakaoReady;
    kakaoReady = new Promise((res,rej)=>{
      if(!key) return rej(new Error("no key"));
      const t=setTimeout(()=>rej(new Error("timeout")),8000);
      const sc=document.createElement("script");
      sc.src=`https://dapi.kakao.com/v2/maps/sdk.js?appkey=${encodeURIComponent(key)}&autoload=false`;
      sc.onload=()=>{ try{ window.kakao.maps.load(()=>{ clearTimeout(t); res(window.kakao); }); }catch(e){ clearTimeout(t); rej(e); } };
      sc.onerror=()=>{ clearTimeout(t); rej(new Error("load error")); };
      document.head.appendChild(sc);
    });
    return kakaoReady;
  }
  // ---------- 카카오맵 ----------
  function kakaoMap(el,opt){
    const K=window.kakao.maps;
    const map=new K.Map(el,{center:new K.LatLng(37.4105,127.145),level:5});
    if(opt.zoomControl) map.addControl(new K.ZoomControl(), K.ControlPosition.RIGHT);
    const node=html=>{ const d=document.createElement("div"); d.innerHTML=html; return d.firstElementChild||d; };
    return {
      kind:"kakao",
      layer(){
        const items=new Set();
        return {
          add(lat,lng,html,o={}){
            const ov=new K.CustomOverlay({position:new K.LatLng(lat,lng),content:node(html),xAnchor:.5,yAnchor:.5,zIndex:o.z||1,clickable:false});
            ov.setMap(map); items.add(ov);
            return { move(a,b){ ov.setPosition(new K.LatLng(a,b)); }, html(h){ ov.setContent(node(h)); }, remove(){ ov.setMap(null); items.delete(ov); } };
          },
          clear(){ items.forEach(o=>o.setMap(null)); items.clear(); }
        };
      },
      fit(pts,p={}){
        if(!pts.length) return;
        const b=new K.LatLngBounds(); pts.forEach(([a,c])=>b.extend(new K.LatLng(a,c)));
        map.setBounds(b,dv(p.top,40),dv(p.right,40),dv(p.bottom,40),dv(p.left,40));
        if(map.getLevel()<(dv(p.minLevel,3))) map.setLevel(dv(p.minLevel,3));
      },
      center(lat,lng,keep){ map.setCenter(new K.LatLng(lat,lng)); if(!keep && map.getLevel()>4) map.setLevel(4); },
      resize(){ map.relayout(); },
      onDrag(cb){ K.event.addListener(map,"dragstart",cb); },
      circle(lat,lng,r,color){ const c=new K.Circle({center:new K.LatLng(lat,lng),radius:r,strokeWeight:2,strokeColor:color,strokeOpacity:.9,strokeStyle:"dash",fillColor:color,fillOpacity:.12}); c.setMap(map);
        return { set(a,b,rr){ c.setPosition(new K.LatLng(a,b)); c.setRadius(rr); }, remove(){ c.setMap(null); } }; },
      onClick(cb){ K.event.addListener(map,"click",e=>cb(e.latLng.getLat(),e.latLng.getLng())); },
      // 선 그리기: pts=[[lat,lng],…], o={color,weight,opacity,dash}
      line(pts,o){ o=o||{}; const mk=(p,oo)=>new K.Polyline({path:p.map(a=>new K.LatLng(a[0],a[1])),strokeWeight:oo.weight||5,strokeColor:oo.color||"#1B2B5C",strokeOpacity:dv(oo.opacity,.8),strokeStyle:oo.dash?"shortdash":"solid",zIndex:oo.z||1});
        let pl=mk(pts,o); pl.setMap(map);
        return { set(p,oo){ pl.setMap(null); pl=mk(p,oo||o); pl.setMap(map); }, remove(){ pl.setMap(null); } }; }
    };
  }
  // ---------- OpenStreetMap (Leaflet) ----------
  function leafletMap(el,opt){
    const map=L.map(el,{zoomControl:!!opt.zoomControl,attributionControl:false});
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19}).addTo(map);
    map.setView([37.4105,127.145],14);
    return {
      kind:"osm",
      layer(){
        const g=L.layerGroup().addTo(map);
        return {
          add(lat,lng,html,o={}){
            const ic=h=>L.divIcon({className:"",html:`<div class="mkc">${h}</div>`,iconSize:null,iconAnchor:[0,0]});
            const m=L.marker([lat,lng],{icon:ic(html),interactive:false,zIndexOffset:(o.z||1)*100}).addTo(g);
            return { move(a,b){ m.setLatLng([a,b]); }, html(h){ m.setIcon(ic(h)); }, remove(){ g.removeLayer(m); } };
          },
          clear(){ g.clearLayers(); }
        };
      },
      fit(pts,p={}){
        if(!pts.length) return; map.invalidateSize();
        map.fitBounds(L.latLngBounds(pts),{paddingTopLeft:[dv(p.left,40),dv(p.top,40)],paddingBottomRight:[dv(p.right,40),dv(p.bottom,40)],maxZoom:dv(p.maxZoom,16),animate:false});
      },
      center(lat,lng,keep){ map.setView([lat,lng], keep? map.getZoom() : Math.max(map.getZoom()||15,15), {animate:false}); },
      resize(){ map.invalidateSize(); },
      onDrag(cb){ map.on("dragstart",cb); },
      circle(lat,lng,r,color){ const c=L.circle([lat,lng],{radius:r,color,weight:2,dashArray:"6 5",fillColor:color,fillOpacity:.12,interactive:false}).addTo(map);
        return { set(a,b,rr){ c.setLatLng([a,b]); c.setRadius(rr); }, remove(){ map.removeLayer(c); } }; },
      onClick(cb){ map.on("click",e=>cb(e.latlng.lat,e.latlng.lng)); },
      line(pts,o){ o=o||{}; const st=oo=>({color:oo.color||"#1B2B5C",weight:oo.weight||5,opacity:dv(oo.opacity,.8),dashArray:oo.dash?"8 8":null,interactive:false,lineCap:"round",lineJoin:"round"});
        let pl=L.polyline(pts,st(o)).addTo(map);
        return { set(p,oo){ pl.setLatLngs(p); pl.setStyle(st(oo||o)); }, remove(){ map.removeLayer(pl); } }; }
    };
  }
  async function create(el,opt={}){
    if(typeof el==="string") el=document.getElementById(el);
    let key=opt.kakaoKey;
    if(key){
      try{ await loadKakao(key); const m=kakaoMap(el,opt); el.classList.add("is-kakao"); return m; }
      catch(e){ console.warn("카카오맵을 불러오지 못해 OpenStreetMap으로 표시합니다.", e); }
    }
    el.classList.add("is-osm");
    return leafletMap(el,opt);
  }
  return { create };
})();
// 카카오 지도 키: 지난번 받은 값을 먼저 쓰고(빠른 시작), Firebase 설정에서 새 값을 확인
async function getKakaoKey(db, ref, get){
  let cached=null; try{ cached=localStorage.getItem("kakaoKey"); }catch(_){}
  const fresh = get(ref(db,"config/kakaoKey")).then(s=>{ const v=(s.val()||"").trim(); try{ localStorage.setItem("kakaoKey",v); }catch(_){} return v; }).catch(()=>cached||"");
  if(cached){ fresh.then(v=>{ if(v!==cached) console.info("지도 키가 바뀌었습니다. 다음에 열 때 반영됩니다."); }); return cached; }
  return await Promise.race([fresh, new Promise(r=>setTimeout(()=>r(""),7000))]);
}
// 관리자가 지도 키를 넣거나 바꾸면, 열려 있는 화면도 한 번 새로고침해서 바로 바뀌게 함
// (canReload가 false를 돌려주면 — 예: 드라이버 운행 중 — 새로고침하지 않고 다음에 열 때 반영)
function watchKakaoKey(db, ref, onValue, used, canReload){
  onValue(ref(db,"config/kakaoKey"), s=>{
    const v=(s.val()||"").trim(); try{ localStorage.setItem("kakaoKey",v); }catch(_){}
    if(v===(used||"")) return;
    const tag="kkReload:"+v; let done=null; try{ done=sessionStorage.getItem(tag); }catch(_){}
    if(done || (canReload && !canReload())) return;
    try{ sessionStorage.setItem(tag,"1"); }catch(_){}
    location.reload();
  }, ()=>{});
}

// 날짜(한국 날짜 문자열 YYYY-MM-DD)로 절기·계절 테마 고르기
function easterDate(y){ const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1; return Date.UTC(y,mo-1,da); }
function autoThemeFor(ymd){
  const [y,mo,da]=ymd.split("-").map(Number), t=Date.UTC(y,mo-1,da), D=864e5;
  const xmas=Date.UTC(y,11,25), back=new Date(xmas).getUTCDay()||7, advent1=xmas-back*D-21*D;
  if((mo===12 && da>=24) || (mo===1 && da<=6)) return "christmas";
  if(t>=advent1 && t<xmas) return "advent";
  const E=easterDate(y);
  if(t>=E-46*D && t<E) return "lent";
  if(t>=E && t<E+49*D) return "easter";
  if(t>=E+49*D && t<=E+55*D) return "pentecost";
  // 추수감사주일: 11월 셋째 주일, 그 2주 전부터
  const n1=new Date(Date.UTC(y,10,1)).getUTCDay(), sun3=Date.UTC(y,10,1+((7-n1)%7)+14);
  if(t>=sun3-13*D && t<=sun3) return "thanks";
  return mo>=3&&mo<=5?"spring":mo>=6&&mo<=8?"summer":mo>=9&&mo<=11?"autumn":"winter";
}

function parsePath(str){

  const pts=str.split(";").map(p=>p.split(",").map(Number)).filter(a=>a.length===2 && isFinite(a[0]) && isFinite(a[1]));
  if(pts.length<2) return null;
  const cum=[0]; for(let i=1;i<pts.length;i++) cum.push(cum[i-1]+dist({lat:pts[i-1][0],lng:pts[i-1][1]},{lat:pts[i][0],lng:pts[i][1]}));
  return {pts,cum,len:cum[cum.length-1]};
}
function applyPaths(cfg){
  const sig=JSON.stringify(cfg||{}); if(sig===PATHS_SIG) return false; PATHS_SIG=sig; PATHS={}; PATHS_VER++;
  Object.entries(cfg||{}).forEach(([route,dirs])=>{ PATHS[route]={}; Object.entries(dirs||{}).forEach(([k,v])=>{ const P=parsePath(v); if(P) PATHS[route][k]=P; }); });
  return true;
}
function pathFor(route,to){ const k=(PATH_KEY[route]||{})[to]; return (k && PATHS[route] && PATHS[route][k]) || null; }
// 점을 노선 줄 위에 올려 보기: 줄에서 떨어진 거리(off)와 출발점부터 줄을 따라간 거리(along)
function projectOn(P,pt){
  const k=Math.cos(pt.lat*Math.PI/180)*111320, m=110540; let best=null;
  for(let i=0;i<P.pts.length-1;i++){
    const ax=(P.pts[i][1]-pt.lng)*k, ay=(P.pts[i][0]-pt.lat)*m, bx=(P.pts[i+1][1]-pt.lng)*k, by=(P.pts[i+1][0]-pt.lat)*m;
    const dx=bx-ax, dy=by-ay, L2=dx*dx+dy*dy; let t=L2? -(ax*dx+ay*dy)/L2 : 0; t=Math.max(0,Math.min(1,t));
    const x=ax+t*dx, y=ay+t*dy, off=Math.sqrt(x*x+y*y);
    if(!best || off<best.off) best={off, i, t, along:P.cum[i]+t*(P.cum[i+1]-P.cum[i])};
  }
  return best;
}
// 줄의 일부(along a ~ b 미터)만 잘라 점 목록으로
function slicePath(P,a,b){
  a=Math.max(0,a); b=Math.min(P.len,b); if(b<=a) return [];
  const at=s=>{ let i=0; while(i<P.cum.length-2 && P.cum[i+1]<s) i++; const seg=P.cum[i+1]-P.cum[i]||1, t=(s-P.cum[i])/seg; return [P.pts[i][0]+(P.pts[i+1][0]-P.pts[i][0])*t, P.pts[i][1]+(P.pts[i+1][1]-P.pts[i][1])*t]; };
  const out=[at(a)]; P.cum.forEach((c,i)=>{ if(c>a && c<b) out.push(P.pts[i]); }); out.push(at(b)); return out;
}
// 노선 줄을 따라 남은 거리 (줄을 쓸 수 없으면 null)
//  → {rem: 남은 거리(m, 음수면 이미 지나감)}
function alongRemain(route,stop,b){
  const P=b.to?pathFor(route,b.to):null; if(!P) return null;
  const pb=projectOn(P,b), ps=projectOn(P,stop);
  if(!pb || !ps || pb.off>60 || ps.off>90) return null;   // 버스가 노선에서 벗어남(우회 등) → 예전 방식
  return {rem: ps.along-pb.along};
}
// ==== PATHKIT END ====
function busRel(route,stop,b,prev){
  const d=dist(b,stop), r=stopR(stop), de=Math.max(0,d-r), dest=stopDest(route,stop.id);
  const moving = typeof b.spd==="number" && b.spd>SLOW_KMH, inside = d<=r;
  const match = !b.to || !dest || b.to===dest;
  if(!match){
    if(inside && !moving && RTERM[route].includes(stop.id)) return {d,de:0,arrived:true,eta:0,waiting:true};
    return null;
  }
  if(!b.to && moving && typeof b.hd==="number" && !inside && angDiff(bearingTo(b,stop),b.hd)>100) return null;
  // 노선 줄이 있으면: 줄을 따라 남은 거리로 계산하고, 이미 지나간 정류장은 빼기
  if(match && b.to){ const A=alongRemain(route,stop,b);
    if(A){ if(inside && !moving) return {d,de:0,arrived:true,eta:0};
      if(A.rem < -Math.max(r,30)) return null;
      const remE=Math.max(0,A.rem-r); return {d,de:remE,arrived:false,eta:remE/BUS_SPEED_M_PER_MIN,onPath:true}; } }
  const key=route+b.bus+stop.id, p=prev[key];
  const approaching = (inside&&!moving) || p==null || d < p.d-10 || (p.approaching && d <= p.d+10);
  if(p==null || Math.abs(d-p.d)>10) prev[key]={d,approaching};
  if(!approaching) return null;
  const arrived = inside && !moving;
  return {d,de,arrived,eta: arrived?0:de*ROAD_FACTOR/BUS_SPEED_M_PER_MIN};
}
function liveEta(route,stop){
  let best=null;
  liveBuses(route).forEach(b=>{
    if(b.old) return; const x=busRel(route,stop,b,prev); if(!x) return;
    if(!best || x.eta<best.eta) best={bus:b.bus,d:x.de,eta:x.eta,arrived:x.arrived};
  });
  return best;
}

function restReason(){
  if(qs.get("rest")==="1") return "none";
  if(RT.some(r=>liveBuses(r).some(b=>!b.old))) return "";
  const t=todayStr(); if(REST_CFG.dates && Object.prototype.hasOwnProperty.call(REST_CFG.dates,t)) return "manual";
  const {day,min}=nowKST();
  const all=[]; RT.forEach(r=>(DEP_ROWS[r]||[]).forEach(([id])=>scheduleFor(r,id,day).forEach(x=>all.push(toM(x)))));
  if(!all.length) return "none";
  if(REST_CFG.afterEnd!==false && Math.max(...all)+30 < min) return "end";
  if(REST_CFG.beforeFirst!==false && min < Math.min(...all)-60) return "early";
  return "";
}

function nextService(r){
  const {day}=nowKST();

    const ds=new Date(serverNow()+9*3600e3+k*86400e3).toISOString().slice(0,10);

              : early ? `오늘 셔틀은 <br>${firsts.length?ampm(firsts[0].m):""}에 시작합니다` : "오늘은 셔틀이 <br>운행하지 않습니다";
  const sub = memo || (REST_WHY==="end" ? "함께해 주셔서 감사합니다" : early ? "첫차 1시간 전부터 실시간 안내가 나옵니다" : "");
  let h=`<div class="rb-head"><div class="rb-top"><span class="rb-ic" aria-hidden="true">${REST_WHY==="end"?"🙏":early?"🌅":"🚌"}</span><div><h2>${title}</h2>${sub?`<p class="rb-memo">${esc(sub)}</p>`:""}</div></div><div class="rb-list">`;
  RT.forEach(r=>{ const R=ROUTES[r];
    if(early){ const f=todayFirst(r); h+=`<div class="rb-next"><span class="rb-r"><i style="background:${R.color}"></i>${R.name} 오늘 첫차</span>${f?`<b>${ampm(f.m)}</b><small>${f.lab}</small>`:`<b>오늘은 쉼</b>`}</div>`; return; }
    const n=nextService(r);
    h+=`<div class="rb-next"><span class="rb-r"><i style="background:${R.color}"></i>${R.name} 다음 운행</span>${n?`<b>${n.k===1?"내일 ":""}${n.k>6?n.ds.slice(5).replace("-","/")+" ":""}${DAYNAME[n.d]} <em>${ampm(n.m)} 첫차</em></b><small>${n.lab}</small>`:`<b>시간표 확인</b>`}</div>`; });
  h+=`</div></div><div class="rb-more">`;
  const v=String(REST_CFG.verse||"").trim();
  if(v) h+=`<div class="rb-sec rb-verse"><h3>📖 이번 주 말씀</h3><p>${esc(v).replace(/\n/g,"<br>")}</p>${REST_CFG.verseRef?`<cite>${esc(REST_CFG.verseRef)}</cite>`:""}</div>`;
  const w=String(REST_CFG.worship||"").split(/\n/).map(x=>x.trim()).filter(Boolean);
  if(w.length) h+=worshipHtml(w);
  h+=weekHtml()+`</div>`;
  const box=$("restBox"); box.classList.toggle("nv",!v); box.classList.toggle("nw",!w.length);
  setH(box,h); rbShow();
}
// 안내 칸이 좁을 때(포스터와 함께)는 말씀 · 예배 안내 · 이번 주 운행을 10초마다 하나씩 보여 줌
const RB={i:0,t:0};
function rbShow(){ const L=[...document.querySelectorAll("#restBox .rb-sec")]; if(!L.length) return; RB.i%=L.length; L.forEach((x,k)=>x.classList.toggle("on",k===RB.i));
  const d=document.querySelector("#restBox .rb-dots"); if(d) d.remove();
  if(L.length>1){ const m=document.querySelector("#restBox .rb-more"); const dd=document.createElement("div"); dd.className="rb-dots"; dd.innerHTML=L.map((_,k)=>`<i class="${k===RB.i?'on':''}"></i>`).join(""); m.appendChild(dd); } }
setInterval(()=>{ if(!document.body.classList.contains("rest")) return; RB.i++; rbShow(); },10000);
// ---------- 행사 포스터 슬라이드 (관리자 → TV 화면 → 행사 포스터) ----------
function watchPosters(on){
  if(on && !posterUnsub) posterUnsub=onValue(ref(db,"tvmedia/posters"), s=>{ const v=s.val()||{}; POSTER_IMG={}; Object.entries(v).forEach(([k,x])=>{ if(x&&x.data) POSTER_IMG[k]=x.data; }); applyMode(); }, ()=>{});
  if(!on && posterUnsub){ posterUnsub(); posterUnsub=null; POSTER_IMG={}; }
}
let PS={ids:"",i:0,timer:null,sec:0,list:[]};
function drawPosters(ids){
  const key=ids.join(",");
  if(key!==PS.ids){
    PS.ids=key; PS.i=0;
    $("pSlides").innerHTML=ids.map((id,k)=>`<img src="${POSTER_IMG[id]}" alt="" class="${k===0?'on':''}">`).join("");
    $("pDots").innerHTML=ids.length>1?ids.map((_,k)=>`<i class="${k===0?'on':''}"></i>`).join(""):"";
    PS.list=ids; if(ids.length) paintFrame(ids[0]);
  }
  const sec=[5,8,10,15].includes(+POSTER_CFG.sec)?+POSTER_CFG.sec:8;
  if(ids.length>1 && (!PS.timer || PS.sec!==sec)){ clearInterval(PS.timer); PS.sec=sec; PS.timer=setInterval(nextSlide,sec*1000); }
  if(ids.length<=1 && PS.timer){ clearInterval(PS.timer); PS.timer=null; }
}
function nextSlide(){
  const imgs=$("pSlides").children, dots=$("pDots").children, n=imgs.length; if(n<2) return;
  imgs[PS.i].classList.remove("on"); if(dots[PS.i]) dots[PS.i].classList.remove("on");
  PS.i=(PS.i+1)%n; imgs[PS.i].classList.add("on"); if(dots[PS.i]) dots[PS.i].classList.add("on");
  paintFrame(PS.list[PS.i]);
}
// 포스터 대표 색을 뽑아 액자(바탕)를 그 색의 연한 톤으로 — 밝은 테마는 연하게, 어두운 테마는 차분하게
const PCOL={}; let PF=0;
function posterColor(id){ return new Promise(res=>{ if(PCOL[id]) return res(PCOL[id]); const src=POSTER_IMG[id]; if(!src) return res([128,128,128]);
  const im=new Image(); im.onload=()=>{ try{ const c=document.createElement("canvas"); c.width=c.height=32; const g=c.getContext("2d"); g.drawImage(im,0,0,32,32);
    const d=g.getImageData(0,0,32,32).data; let r=0,gg=0,b=0,wsum=0;
    for(let i=0;i<d.length;i+=4){ const R=d[i],G=d[i+1],B=d[i+2], mx=Math.max(R,G,B), mn=Math.min(R,G,B), w=1+(mx-mn)/40; r+=R*w; gg+=G*w; b+=B*w; wsum+=w; }
    PCOL[id]=[r/wsum,gg/wsum,b/wsum].map(Math.round); }catch(_){ PCOL[id]=[128,128,128]; } res(PCOL[id]); };
  im.onerror=()=>res([128,128,128]); im.src=src; }); }
function paintFrame(id){
  if(!id) return;
  posterColor(id).then(c=>{
    const light=document.body.classList.contains("light"), mix=(t,k)=>c.map((v,i)=>Math.round(v*(1-k)+t[i]*k));
    const base=light?[255,255,255]:[14,18,28], a=mix(base,light?.5:.55), b=mix(base,light?.76:.78);
    const bg=`radial-gradient(ellipse 75% 70% at 50% 46%, rgb(${a}) 0%, rgb(${b}) 62%, var(--cardA,var(--card)) 100%)`;
    const L=[$("pBg"),$("pBg2")], on=L[PF], off=L[1-PF]; off.style.background=bg; off.style.opacity="1"; on.style.opacity="0"; PF=1-PF;
  });
}

// ---------- QR (성도님 주소) ----------
try{
  const url=location.origin+location.pathname.replace(/[^/]*$/,"");
  const q=qrcode(0,"M"); q.addData(url); q.make();
  QR_IMG=q.createDataURL(8,0);
  $("qr").innerHTML=`<img src="${QR_IMG}" alt="" style="width:100%;height:100%;image-rendering:pixelated">`;
}catch(_){ $("qr").classList.add("hide"); }

// ---------- 시작 ----------
(async()=>{
  RT=computeRT(); document.body.classList.toggle("one",RT.length===1); drawLegend();
  applyTheme(); loadWx(); setInterval(loadWx, 30*60e3);
  await initMap(); drawTvPaths();
  ["yatap","park"].forEach(r=>onValue(ref(db,"waitc/"+r), s=>{ WAITC[r]=s.val()||{}; drawBoards(); }, ()=>{}));
  onValue(ref(db,"live"), s=>{ const v=s.val()||{}; LIVE={yatap:v.yatap||{},park:v.park||{}}; applyRT(); drawMap(); drawBoards(); });
  onValue(ref(db,"config"), s=>{ const c=s.val()||{}; applyBrand(c); WAIT_CFG=c.waitCfg||{};
    TV_ROUTES=["auto","both","yatap","park"].includes(c.tvRoutes)?c.tvRoutes:"auto";
    const tr=c.tvRest||{}; REST_CFG={afterEnd: tr.afterEnd!==false, beforeFirst: tr.beforeFirst!==false, dates: tr.dates||{}, verse: tr.verse||"", verseRef: tr.verseRef||"", worship: tr.worship||""};
    const pc=c.tvPosters||{}; POSTER_CFG={when:["rest","always","off"].includes(pc.when)?pc.when:"rest", sec:pc.sec||8}; POSTER_META=c.tvPosterList||{};
    applyRT();
    if(applyStops(c.stops)) drawStopMarks();
    NEWS_CFG=c.news||null; drawTicker();
    THEME_CFG=c.tvTheme||{}; watchPhoto(); applyTheme();
    if(applyPaths(c.paths)) drawTvPaths();
    PARK_TIMES=parseTimes(c.parkTimes); TIMES=c.times||{};
    const n=c.notice, show=n&&n.on&&n.text; $("notice").classList.toggle("hide",!show);
    if(show) $("notice").innerHTML=`<span aria-hidden="true">📢</span><span>${esc(n.text)}</span>`;
    $("boards")._h=null; drawBoards(); try{ applyMode(); }catch(_){} });
  setInterval(()=>{ applyRT(); drawMap(); drawBoards(); },4000);
  setInterval(drawTicker,60e3); // 날짜가 바뀌면 지난 소식 내리기
  tickClock(); setInterval(tickClock,1000);
  keepAwake();
})();
</script>
