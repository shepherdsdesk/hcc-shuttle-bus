<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HCC 셔틀버스 · 운행 현황판</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0B1220">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root{--navy:#1B2B5C;--teal:#0F766E;--bg:#0B1220;--card:#131C2E;--line:#1F2A40;--sub:#94A3B8;--y:#93C5FD;--p:#5EEAD4;--amber:#F59E0B}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:#F8FAFC;font-family:"Pretendard Variable",Pretendard,"Noto Sans KR",system-ui,sans-serif;letter-spacing:-.02em;overflow:hidden}
  body.idle{cursor:none}
  .tv{height:100vh;display:flex;flex-direction:column;gap:1.2vmin;padding:1.6vmin 1.8vmin}
  .tv>.main{flex:1}
  header{display:flex;align-items:center;gap:1.6vmin}
  .logo{width:6vmin;height:6vmin;border-radius:1.6vmin;background:var(--navy);display:grid;place-items:center;border:.25vmin solid #2B3D75}
  .logo svg{width:58%;height:58%}
  header h1{margin:0;font-size:3.6vmin;font-weight:900;line-height:1.1}
  header small{display:block;font-size:1.9vmin;color:var(--sub);font-weight:600}
  .live{display:flex;align-items:center;gap:1vmin;font-size:2vmin;font-weight:800;color:#FCA5A5;margin-left:2vmin}
  .live i{width:1.4vmin;height:1.4vmin;border-radius:50%;background:#EF4444}
  .live.ok{color:#86EFAC}.live.ok i{background:#22C55E;animation:lp 1.6s infinite}
  @keyframes lp{0%{box-shadow:0 0 0 0 rgba(34,197,94,.6)}70%{box-shadow:0 0 0 1.4vmin rgba(34,197,94,0)}100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}}
  .clock{margin-left:auto;text-align:right}
  .clock b{display:block;font-size:5.4vmin;font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
  .clock span{font-size:1.9vmin;color:var(--sub);font-weight:700}
  .notice{display:flex;gap:1.2vmin;align-items:center;background:#2A1C08;border:.25vmin solid #8A5A12;color:#FCD34D;border-radius:1.6vmin;padding:1.2vmin 2vmin;font-size:2.6vmin;font-weight:800}
  .main{display:grid;grid-template-columns:1.25fr 1fr .8fr;grid-template-areas:"map boards times";gap:1.6vmin;min-height:0}
  .mapbox{grid-area:map}.boards{grid-area:boards}.times{grid-area:times}
  /* 시간표 */
  .times{background:var(--card);border:.2vmin solid var(--line);border-radius:2vmin;padding:1.2vmin 1.8vmin;display:flex;flex-direction:column;gap:1vmin;overflow:hidden;min-height:0}
  .times>h2{margin:0;display:flex;align-items:baseline;gap:1vmin;font-size:2.7vmin;font-weight:900}
  .times>h2 small{margin-left:auto;font-size:1.8vmin;color:var(--sub);font-weight:700}
  .ttr{display:flex;flex-direction:column;gap:.6vmin;padding-top:.9vmin;border-top:.15vmin solid var(--line)}
  .ttr h3{margin:0;display:flex;align-items:center;gap:1vmin;font-size:2.1vmin;font-weight:900}
  .ttr h3 i{width:1.6vmin;height:1.6vmin;border-radius:.4vmin}
  .ttl{display:flex;flex-direction:column;gap:.5vmin}
  .ttl .lab{font-size:1.75vmin;color:var(--sub);font-weight:800}
  .chips{display:flex;flex-wrap:wrap;gap:.6vmin}
  .chips b{background:#1E293B;color:#F8FAFC;border-radius:.8vmin;padding:.4vmin 1vmin;font-size:2.2vmin;font-weight:800;font-variant-numeric:tabular-nums}
  .chips b.first{background:var(--navy);color:#fff;box-shadow:0 0 0 .25vmin #93C5FD}
  .ttr.park .chips b.first{background:var(--teal);box-shadow:0 0 0 .25vmin #5EEAD4}
  .chips .none{font-size:1.9vmin;color:#64748B;font-weight:700}
  /* 화면 방향 고르기 */
  .ctl{position:fixed;left:50%;bottom:1.4vmin;transform:translateX(-50%);z-index:2000;display:flex;gap:1vmin;align-items:center;background:rgba(11,18,32,.92);border:.2vmin solid var(--line);border-radius:1.4vmin;padding:.8vmin;transition:opacity .3s}
  .ctl button{white-space:nowrap;border:0;background:#1E293B;color:#fff;border-radius:1vmin;padding:1vmin 1.5vmin;font:inherit;font-size:1.8vmin;font-weight:800;cursor:pointer}
  .ctl button.on{background:#F59E0B;color:#0B1220}
  .ctl button:focus-visible{outline:.4vmin solid #FCD34D;outline-offset:.2vmin}
  .ctl span{white-space:nowrap;font-size:1.6vmin;color:var(--sub);font-weight:700;margin:0 .4vmin 0 1vmin}
  body.idle .ctl{opacity:0;pointer-events:none}
  /* TV를 세로로 세웠는데 화면이 가로로 나올 때: 화면을 90도 돌림 */
  body.rot-r .tv,body.rot-l .tv{position:fixed;width:100vh;height:100vw;transform-origin:0 0}
  body.rot-r .tv{top:0;left:100vw;transform:rotate(90deg)}
  body.rot-l .tv{top:100vh;left:0;transform:rotate(-90deg)}
  .mapbox{position:relative;border-radius:2vmin;overflow:hidden;border:.2vmin solid var(--line);min-height:0}
  #map{position:absolute;inset:0;background:#111A2B}
  #map .leaflet-tile-pane,#map.is-kakao img{filter:invert(1) hue-rotate(180deg) brightness(.82) contrast(.92)}
  .legend{position:absolute;left:1.2vmin;bottom:1.2vmin;z-index:900;display:flex;gap:1.4vmin;align-items:center;background:rgba(11,18,32,.86);border:.2vmin solid var(--line);border-radius:1.2vmin;padding:.9vmin 1.4vmin;font-size:1.7vmin;font-weight:700;color:#CBD5E1}
  .legend span{display:inline-flex;align-items:center;gap:.7vmin}
  .legend i{width:1.6vmin;height:1.6vmin;border-radius:.4vmin;display:inline-block}
  .boards{display:flex;flex-direction:column;gap:1.6vmin;min-height:0}
  .rt{flex:1;min-height:0;background:var(--card);border:.2vmin solid var(--line);border-radius:2vmin;padding:1.2vmin 1.8vmin;display:flex;flex-direction:column;gap:.4vmin;overflow:hidden}
  .rt h2{margin:0 0 .3vmin;display:flex;align-items:center;gap:1.2vmin;font-size:2.7vmin;font-weight:900}
  .rt h2 .sw{width:2vmin;height:2vmin;border-radius:.5vmin}
  .rt h2 small{margin-left:auto;font-size:1.9vmin;color:var(--sub);font-weight:700}
  .stop{display:flex;align-items:center;gap:1.6vmin;padding:.75vmin 0;border-top:.15vmin solid var(--line)}
  .stop:first-of-type{border-top:0}
  .stop .nm{flex:1;min-width:0}
  .stop .nm b{display:block;font-size:2.4vmin;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .stop .nm span{font-size:1.6vmin;color:var(--sub);font-weight:600}
  .eta{text-align:right;white-space:nowrap}
  .eta b{font-size:4vmin;font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
  .eta b small{font-size:2.2vmin;font-weight:800;margin-left:.3vmin}
  .eta span{display:block;font-size:1.55vmin;color:var(--sub);font-weight:700;margin-top:.2vmin}
  .eta.soon b{color:#FCA5A5}
  .eta.sch b{font-size:2.9vmin;color:#E2E8F0}
  .eta.none b{font-size:2.3vmin;color:#64748B}
  .next{margin-top:auto;display:flex;align-items:center;gap:.8vmin;flex-wrap:wrap;font-size:1.7vmin;color:var(--sub);font-weight:700;padding-top:.8vmin;border-top:.15vmin solid var(--line)}
  .next b{background:#1E293B;color:#F8FAFC;border-radius:.8vmin;padding:.35vmin 1vmin;font-size:2.05vmin;font-variant-numeric:tabular-nums}
  .next b.first{background:var(--navy);color:#fff}
  .rt.park .next b.first{background:var(--teal)}
  footer{display:flex;align-items:center;gap:1.6vmin;color:var(--sub);font-size:1.8vmin;font-weight:600}
  footer .qr{background:#fff;border-radius:1vmin;padding:.6vmin;width:8.5vmin;height:8.5vmin}
  footer .qr svg{width:100%;height:100%;display:block}
  footer b{color:#F8FAFC;font-size:2.3vmin;display:block}
  footer .credit{margin-left:auto;text-align:right;font-size:1.6vmin}
  /* 지도 표시 */
  .mkc{position:absolute;left:0;top:0;transform:translate(-50%,-50%)}
  .pill{display:inline-flex;align-items:center;gap:.6vmin;white-space:nowrap;font-size:2.1vmin;font-weight:900;padding:.6vmin 1.3vmin .6vmin .7vmin;border-radius:999px;box-shadow:0 .4vmin 1.4vmin rgba(0,0,0,.5);border:.3vmin solid #0B1220;color:#fff}
  .pill .n{width:2.8vmin;height:2.8vmin;border-radius:50%;background:#fff;display:inline-grid;place-items:center;font-size:1.8vmin}
  .pill.out{background:#0B1220!important}
  .pill.out .n{color:#fff}
  .pill.old{opacity:.45}
  .pill svg{width:2vmin;height:2vmin}
  .stopmk{position:relative;width:2.4vmin;height:2.4vmin;border-radius:50%;background:#0B1220;border:.6vmin solid var(--y);box-sizing:border-box}
  .stoplab{position:absolute;bottom:calc(100% + .7vmin);left:50%;transform:translateX(-50%);white-space:nowrap;background:rgba(11,18,32,.9);border:.15vmin solid var(--line);font-size:1.7vmin;font-weight:800;padding:.3vmin .9vmin;border-radius:.8vmin;color:#E2E8F0}
  .hide{display:none!important}
  .toast{display:none}
  /* 세로 화면 */
  body.portrait .main{grid-template-columns:1fr;grid-template-rows:32% 1fr auto;grid-template-areas:"map" "boards" "times"}
  body.portrait header h1{font-size:4vmin}
  body.portrait .times>h2{font-size:3vmin}
  body.portrait .ttr{flex-direction:row;gap:2vmin}
  body.portrait .ttr h3{min-width:22vmin;align-self:flex-start;padding-top:.4vmin}
  body.portrait .ttr .ttls{flex:1;display:flex;flex-direction:column;gap:.8vmin}
  /* 노선 하나만 보여 줄 때 (tv.html?route=yatap) */
  body.one .main{grid-template-columns:1.2fr 1fr .8fr}
  body.one.portrait .main{grid-template-columns:1fr}
  body.one .rt{flex:1}
</style>
</head>
<body>
<div class="tv">
  <header>
    <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" aria-hidden="true"><rect x="4" y="3" width="16" height="14" rx="3"/><path d="M4 11h16M8 21v-4M16 21v-4"/></svg></div>
    <div><h1>HCC 셔틀버스 운행 현황</h1><small>할렐루야교회 셔틀 실시간 안내</small></div>

</div>
<div class="toast" id="toast"><b id="toastT"></b><span id="toastS"></span><button id="toastX"></button></div>

<script type="module">


import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { getDatabase, ref, onValue, set, update, push, remove, get, onDisconnect, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";

// ================= 설정 =================
const firebaseConfig = {
  apiKey: "AIzaSyBwaQjrMr0AwBYW-RagoQ3XrQDxXc8UGn0",
  authDomain: "hcc-shuttle-bus.firebaseapp.com",
  databaseURL: "https://hcc-shuttle-bus-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "hcc-shuttle-bus",
  storageBucket: "hcc-shuttle-bus.firebasestorage.app",
  messagingSenderId: "1010817566139",
  appId: "1:1010817566139:web:03c1a8571481f1ddf8f09e"
};
const SEND_EVERY_MS = 5000;      // 기사님 위치 전송 간격
const STALE_MS = 90 * 1000;      // 이 시간 동안 신호가 없으면 '신호 약함'
const GONE_MS = 10 * 60 * 1000;  // 이 시간 지나면 화면에서 숨김
const NEAR_M = 700;              // 알림 거리(약 2~3분)
const BUS_SPEED_M_PER_MIN = 330; // 시내 평균 약 20km/h
const ROAD_FACTOR = 1.35;        // 직선거리 → 도로거리 보정
const WAIT_MS = 15 * 60 * 1000;   // '여기서 기다려요' 자동 해제 시간

// ================= 노선 · 정류장 =================
const ROUTES = {
  yatap:{ name:"야탑역 셔틀", color:"#1B2B5C", buses:4,
    stops:[ {id:"byc", name:"야탑역 BYC 앞", sub:"2번 출구 신한은행 앞 대로변", lat:37.41093, lng:127.12925, r:60},
            {id:"church", name:"할렐루야교회", sub:"교회 입구", lat:37.40990, lng:127.15590, r:120} ],
    tip:"중간 구간은 손을 들면 세워 드려요. 지도에서 버스 위치를 보고 미리 나와 계세요." },
  park:{ name:"파킹엔젤스", color:"#0F766E", buses:4,
    stops:[ {id:"cdong", name:"테크노파크 C동", sub:"주차 후 탑승", lat:37.40500, lng:127.15521, r:60},
            {id:"dmv", name:"차량등록사업소 주차장", sub:"경유 · 주차장에서 탑승", lat:37.40691, lng:127.15397, r:80},
            {id:"church", name:"할렐루야교회", sub:"교회 입구", lat:37.40990, lng:127.15590, r:120} ],
    tip:"주일에만 운행합니다. 테크노파크 C동 → 차량등록사업소 → 교회 순서로 돕니다." }
};
// 정류장 위치·도착 반경: 관리자가 지도에서 고친 값(config/stops/정류장id)이 있으면 그걸 씀
Object.values(ROUTES).forEach(R=>R.stops.forEach(s=>{ s._def={lat:s.lat,lng:s.lng,r:s.r}; }));
function applyStops(cfg){
  let changed=false;
  Object.values(ROUTES).forEach(R=>R.stops.forEach(s=>{
    const o=(cfg&&cfg[s.id])||{}, d=s._def;
    const lat=typeof o.lat==="number"?o.lat:d.lat, lng=typeof o.lng==="number"?o.lng:d.lng, r=typeof o.r==="number"?o.r:d.r;
    if(lat!==s.lat||lng!==s.lng||r!==s.r){ s.lat=lat; s.lng=lng; s.r=r; changed=true; }
  }));
  return changed;
}
const stopR = s => s.r||60;
const busColor = (route) => ROUTES[route].color;  // 노선 색 (방향은 채움/테두리와 화살표로 구분)

// ================= 시간표 (교회 홈페이지 셔틀버스 안내) =================
const SUN_COLS = ["1부 예배 (08:00)","2부 예배 (09:30)","3부 예배 (11:30)","4부 뉴웨이브 (13:30)","주일 오후"];
const SUN = {
  yatap:[["06:40","07:05","07:20","07:35","07:50","08:05","08:25"],["08:40","08:55","09:10","09:25","09:40","10:00"],["10:20","10:35","10:50","11:05","11:20","11:35","11:50","12:10"],["12:30","12:45","13:00","13:15","13:30","13:45","14:00","14:20"],["14:40","15:00","15:20","15:40","16:00","16:20","16:40"]],
  church:[["06:55","07:10","07:25","07:40","07:55","08:15"],["08:30","08:45","09:00","09:15","09:30","09:50"],["10:10","10:25","10:40","10:55","11:10","11:25","11:40","12:00"],["12:20","12:35","12:50","13:05","13:20","13:35","13:50","14:10"],["14:30","14:50","15:10","15:30","15:50","16:10","16:30","17:00"]]
};
const AM=["9:10","9:30","9:50","10:10","10:30","10:50","11:10","11:30","11:40"], AMC=["9:00","9:20","9:40","10:00","10:20","10:40","11:00","11:20","11:30"];
const PM=["13:10","13:30","13:50","14:10","14:30","14:50","15:10","15:40","16:10","16:40"], PMC=["13:00","13:20","13:40","14:00","14:20","14:40","15:00","15:30","16:00","16:30"];
const WEEK = {
  yatap:{2:[...AM,"12:40",...PM],3:[...AM,"12:30","12:50",...PM],4:[...AM,...PM],
         5:["9:10","9:40","10:10","10:40","11:10","11:40","13:10","13:40","14:10","14:40","15:10","15:40","16:10","16:40","19:00","19:15","19:30","19:45","20:00","20:10"],
         6:[...AM,...PM.slice(0,8)]},
  church:{2:[...AMC,"12:30",...PMC],3:[...AMC,"12:20","12:40",...PMC],4:[...AMC,...PMC],
         5:["9:00","9:30","10:00","10:30","11:00","11:30","13:00","13:30","14:00","14:30","15:00","15:30","16:00","16:30","17:05","18:50","19:05","19:20","19:35","19:50","20:00","22:10"],
         6:[...AMC,...PMC.slice(0,8)]}
};
let PARK_TIMES = []; // Firebase config/parkTimes 에서 읽음 (예: "8:00,8:10,8:20")
let TIMES = {};      // 관리자 페이지에서 고친 시간표 (config/times)
const parseTimes = v => String(v||"").split(/[,\s]+/).map(x=>x.trim()).filter(x=>/^\d{1,2}:\d{2}$/.test(x));
const timesOr = (key,def) => { const v=TIMES[key]; return (typeof v==="string" && parseTimes(v).length) ? parseTimes(v) : def; };

// ================= 도우미 =================
const $ = id => document.getElementById(id);
const setH = (el,h) => { if(el._h!==h){ el._h=h; el.innerHTML=h; } };
const toM = s => { const [h,m]=String(s).trim().split(":").map(Number); return h*60+m; };
const nowKST = () => { const d=new Date(Date.now()+9*3600e3); return {day:d.getUTCDay(), min:d.getUTCHours()*60+d.getUTCMinutes()+d.getUTCSeconds()/60}; };
const dist = (a,b) => { const R=6371000, r=Math.PI/180; const dLat=(b.lat-a.lat)*r, dLng=(b.lng-a.lng)*r;
  const x=Math.sin(dLat/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dLng/2)**2; return 2*R*Math.asin(Math.sqrt(x)); };
const kstDate = ms => new Date(ms+9*3600e3).toISOString().slice(0,10);
const km = m => m<1000 ? Math.round(m/10)*10+"m" : (m/1000).toFixed(1)+"km";
const storage = { get(k){ try{return localStorage.getItem(k);}catch(_){return null;} }, set(k,v){ try{localStorage.setItem(k,v);}catch(_){} } };
let toastTimer;

// ==== MAPKIT START ====  (카카오맵 / OpenStreetMap 공통 지도 — 이 블록은 index·driver·admin·tv에 똑같이 들어갑니다)
// 관리자 설정에 카카오 지도 키(config/kakaoKey)가 있으면 카카오맵, 없거나 불러오지 못하면 OpenStreetMap(Leaflet)을 씁니다.
const MapKit = (()=>{
  const dv=(v,d)=>v==null?d:v; // 오래된 TV 브라우저에서도 동작하도록
  let kakaoReady=null;
  function loadKakao(key){
    if(kakaoReady) return kakaoReady;
    kakaoReady = new Promise((res,rej)=>{
      if(!key) return rej(new Error("no key"));
      const t=setTimeout(()=>rej(new Error("timeout")),8000);
      const sc=document.createElement("script");
      sc.src=`https://dapi.kakao.com/v2/maps/sdk.js?appkey=${encodeURIComponent(key)}&autoload=false`;
      sc.onload=()=>{ try{ window.kakao.maps.load(()=>{ clearTimeout(t); res(window.kakao); }); }catch(e){ clearTimeout(t); rej(e); } };
      sc.onerror=()=>{ clearTimeout(t); rej(new Error("load error")); };
      document.head.appendChild(sc);
    });
    return kakaoReady;
  }
  // ---------- 카카오맵 ----------
  function kakaoMap(el,opt){
    const K=window.kakao.maps;
    const map=new K.Map(el,{center:new K.LatLng(37.4105,127.145),level:5});
    if(opt.zoomControl) map.addControl(new K.ZoomControl(), K.ControlPosition.RIGHT);
    const node=html=>{ const d=document.createElement("div"); d.innerHTML=html; return d.firstElementChild||d; };
    return {
      kind:"kakao",
      layer(){
        const items=new Set();
        return {
          add(lat,lng,html,o={}){
            const ov=new K.CustomOverlay({position:new K.LatLng(lat,lng),content:node(html),xAnchor:.5,yAnchor:.5,zIndex:o.z||1,clickable:false});
            ov.setMap(map); items.add(ov);
            return { move(a,b){ ov.setPosition(new K.LatLng(a,b)); }, html(h){ ov.setContent(node(h)); }, remove(){ ov.setMap(null); items.delete(ov); } };
          },
          clear(){ items.forEach(o=>o.setMap(null)); items.clear(); }
        };
      },
      fit(pts,p={}){
        if(!pts.length) return;
        const b=new K.LatLngBounds(); pts.forEach(([a,c])=>b.extend(new K.LatLng(a,c)));
        map.setBounds(b,dv(p.top,40),dv(p.right,40),dv(p.bottom,40),dv(p.left,40));
        if(map.getLevel()<(dv(p.minLevel,3))) map.setLevel(dv(p.minLevel,3));
      },
      center(lat,lng,keep){ map.setCenter(new K.LatLng(lat,lng)); if(!keep && map.getLevel()>4) map.setLevel(4); },
      resize(){ map.relayout(); },
      onDrag(cb){ K.event.addListener(map,"dragstart",cb); },
      circle(lat,lng,r,color){ const c=new K.Circle({center:new K.LatLng(lat,lng),radius:r,strokeWeight:2,strokeColor:color,strokeOpacity:.9,strokeStyle:"dash",fillColor:color,fillOpacity:.12}); c.setMap(map);
        return { set(a,b,rr){ c.setPosition(new K.LatLng(a,b)); c.setRadius(rr); }, remove(){ c.setMap(null); } }; },
      onClick(cb){ K.event.addListener(map,"click",e=>cb(e.latLng.getLat(),e.latLng.getLng())); }
    };
  }
  // ---------- OpenStreetMap (Leaflet) ----------
  function leafletMap(el,opt){
    const map=L.map(el,{zoomControl:!!opt.zoomControl,attributionControl:false});
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19}).addTo(map);
    map.setView([37.4105,127.145],14);
    return {
      kind:"osm",
      layer(){
        const g=L.layerGroup().addTo(map);
        return {
          add(lat,lng,html,o={}){
            const ic=h=>L.divIcon({className:"",html:`<div class="mkc">${h}</div>`,iconSize:null,iconAnchor:[0,0]});
            const m=L.marker([lat,lng],{icon:ic(html),interactive:false,zIndexOffset:(o.z||1)*100}).addTo(g);
            return { move(a,b){ m.setLatLng([a,b]); }, html(h){ m.setIcon(ic(h)); }, remove(){ g.removeLayer(m); } };
          },
          clear(){ g.clearLayers(); }
        };
      },
      fit(pts,p={}){
        if(!pts.length) return; map.invalidateSize();
        map.fitBounds(L.latLngBounds(pts),{paddingTopLeft:[dv(p.left,40),dv(p.top,40)],paddingBottomRight:[dv(p.right,40),dv(p.bottom,40)],maxZoom:dv(p.maxZoom,16),animate:false});
      },
      center(lat,lng,keep){ map.setView([lat,lng], keep? map.getZoom() : Math.max(map.getZoom()||15,15), {animate:false}); },
      resize(){ map.invalidateSize(); },
      onDrag(cb){ map.on("dragstart",cb); },
      circle(lat,lng,r,color){ const c=L.circle([lat,lng],{radius:r,color,weight:2,dashArray:"6 5",fillColor:color,fillOpacity:.12,interactive:false}).addTo(map);
        return { set(a,b,rr){ c.setLatLng([a,b]); c.setRadius(rr); }, remove(){ map.removeLayer(c); } }; },
      onClick(cb){ map.on("click",e=>cb(e.latlng.lat,e.latlng.lng)); }
    };
  }
  async function create(el,opt={}){
    if(typeof el==="string") el=document.getElementById(el);
    let key=opt.kakaoKey;
    if(key){
      try{ await loadKakao(key); const m=kakaoMap(el,opt); el.classList.add("is-kakao"); return m; }
      catch(e){ console.warn("카카오맵을 불러오지 못해 OpenStreetMap으로 표시합니다.", e); }
    }
    el.classList.add("is-osm");
    return leafletMap(el,opt);
  }
  return { create };
})();
// 카카오 지도 키: 지난번 받은 값을 먼저 쓰고(빠른 시작), Firebase 설정에서 새 값을 확인
async function getKakaoKey(db, ref, get){
  let cached=null; try{ cached=localStorage.getItem("kakaoKey"); }catch(_){}
  const fresh = get(ref(db,"config/kakaoKey")).then(s=>{ const v=(s.val()||"").trim(); try{ localStorage.setItem("kakaoKey",v); }catch(_){} return v; }).catch(()=>cached||"");
  if(cached){ fresh.then(v=>{ if(v!==cached) console.info("지도 키가 바뀌었습니다. 다음에 열 때 반영됩니다."); }); return cached; }
  return await Promise.race([fresh, new Promise(r=>setTimeout(()=>r(""),7000))]);
}
// 관리자가 지도 키를 넣거나 바꾸면, 열려 있는 화면도 한 번 새로고침해서 바로 바뀌게 함
// (canReload가 false를 돌려주면 — 예: 드라이버 운행 중 — 새로고침하지 않고 다음에 열 때 반영)
function watchKakaoKey(db, ref, onValue, used, canReload){
  onValue(ref(db,"config/kakaoKey"), s=>{
    const v=(s.val()||"").trim(); try{ localStorage.setItem("kakaoKey",v); }catch(_){}
    if(v===(used||"")) return;
    const tag="kkReload:"+v; let done=null; try{ done=sessionStorage.getItem(tag); }catch(_){}
    if(done || (canReload && !canReload())) return;
    try{ sessionStorage.setItem(tag,"1"); }catch(_){}
    location.reload();
  }, ()=>{});
}
// ==== MAPKIT END ====

const qs=new URLSearchParams(location.search);
const ONLY=qs.get("route");
const RT = ROUTES[ONLY] ? [ONLY] : ["yatap","park"];

// 화면 방향: 자동 / 가로 / 세로 / 세로(화면 돌리기). 주소 뒤 ?layout=port 처럼 정할 수도 있음
const LAYS=[["auto","자동"],["land","가로"],["port","세로"],["port-r","세로 ↻"],["port-l","세로 ↺"]];
let LAY=(()=>{ const q=qs.get("layout"); if(LAYS.some(x=>x[0]===q)) return q; try{ const v=localStorage.getItem("tvLayout"); if(LAYS.some(x=>x[0]===v)) return v; }catch(_){} return "auto"; })();
function applyLayout(){
  const b=document.body;
  b.classList.toggle("rot-r",LAY==="port-r"); b.classList.toggle("rot-l",LAY==="port-l");
  b.classList.toggle("portrait", LAY.indexOf("port")===0 || (LAY==="auto" && innerHeight>innerWidth));
  const box=document.getElementById("layBtns");
  if(box) box.innerHTML=LAYS.map(([k,t])=>`<button data-lay="${k}" class="${k===LAY?'on':''}">${t}</button>`).join("");
}
applyLayout(); window.addEventListener("resize",applyLayout);
document.getElementById("layBtns").addEventListener("click",e=>{ const bt=e.target.closest("button"); if(!bt) return;
  LAY=bt.dataset.lay; try{ localStorage.setItem("tvLayout",LAY); }catch(_){}
  applyLayout(); $("times")._h=null; drawTimes(); });
// 어두운 화면에서 잘 보이도록 노선 색을 밝게
ROUTES.yatap.color="#3B5BA9"; ROUTES.park.color="#0D9488";
const esc = s => String(s==null?"":s).replace(/[<>&"]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c]));
const hhmm = m => Math.floor(m/60)+":"+String(Math.floor(m)%60).padStart(2,"0");
const inTxt = m => { m=Math.ceil(m); if(m<1) return "곧"; if(m<60) return m+"분 후"; const h=Math.floor(m/60), r=m%60; return r? `${h}시간 ${r}분 후` : `${h}시간 후`; };
const DAYNAME = {0:"주일",1:"월요일",2:"화요일",3:"수요일",4:"목요일",5:"금요일",6:"토요일"};
const arrowR=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>`;
const arrowL=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>`;
function pillHtml(route,b){
  const c=ROUTES[route].color, old=b.old?" old":"";
  if(b.to==="교회") return `<div class="pill${old}" style="background:${c}"><span class="n" style="color:${c}">${b.bus}</span>교회행${arrowR}</div>`;
  if(b.to) return `<div class="pill out${old}" style="color:#fff;border-color:${c}">${arrowL}<span class="n" style="background:${c}">${b.bus}</span>${esc(b.to)}행</div>`;
  return `<div class="pill${old}" style="background:${c};padding-right:.7vmin"><span class="n" style="color:${c}">${b.bus}</span></div>`;
}
let LIVE={yatap:{},park:{}}; const prev={};
function liveBuses(route){
  const now=serverNow(), out=[];
  Object.entries(LIVE[route]||{}).forEach(([bus,v])=>{
    if(!v||typeof v.lat!=="number") return; const age=now-(v.ts||0); if(age>GONE_MS) return;
    out.push({bus:+bus,lat:v.lat,lng:v.lng,age,old:age>STALE_MS,to:v.to||""});
  });
  return out.sort((a,b)=>a.bus-b.bus);
}
function scheduleFor(route,stopId,day){
  if(route==="yatap"){
    if(stopId==="byc") return day===0? timesOr("sun_yatap",SUN.yatap.flat()) : timesOr(`d${day}_yatap`,WEEK.yatap[day]||[]);
    if(stopId==="church") return day===0? timesOr("sun_church",SUN.church.flat()) : timesOr(`d${day}_church`,WEEK.church[day]||[]);
  }
  if(route==="park" && day===0 && stopId==="cdong") return PARK_TIMES;
  return [];
}
function stopDest(route,id){ return (({yatap:{church:"교회",byc:"야탑역"},park:{church:"교회",cdong:"C동",dmv:"교회"}})[route]||{})[id]||null; }
function rideDir(route,id){ return (({yatap:{byc:"교회 가는 버스",church:"야탑역 가는 버스"},park:{cdong:"교회 가는 버스",dmv:"교회 가는 버스",church:"C동 가는 버스"}})[route]||{})[id]||""; }
function liveEta(route,stop){
  let best=null;
  liveBuses(route).forEach(b=>{
    if(b.old) return; const d=dist(b,stop), r=stopR(stop), arrived=d<=r, de=Math.max(0,d-r);
    if(!arrived && b.to && stopDest(route,stop.id) && stopDest(route,stop.id)!==b.to && de>150) return;
    const key=route+b.bus+stop.id, p=prev[key];
    const approaching = arrived || de<150 || p==null || d < p.d-15 || (p.approaching && d <= p.d+15);
    if(p==null || Math.abs(d-p.d)>15) prev[key]={d,approaching};
    if(!approaching) return;
    const eta=arrived?0:de*ROAD_FACTOR/BUS_SPEED_M_PER_MIN;
    if(!best || eta<best.eta) best={bus:b.bus,d:de,eta,arrived};
  });
  return best;
}

// ---------- 지도 ----------
let map, busL, markers={};
async function initMap(){
  const kk=await getKakaoKey(db,ref,get);
  map=await MapKit.create("map",{kakaoKey: kk});
  watchKakaoKey(db,ref,onValue,kk);
  stopL=map.layer(); drawStopMarks();
  busL=map.layer();
  const fit=()=>{ const pts=[]; RT.forEach(r=>ROUTES[r].stops.forEach(s=>pts.push([s.lat,s.lng]))); map.resize(); map.fit(pts,{top:60,left:60,right:60,bottom:70}); };
  fit(); window.addEventListener("resize",()=>setTimeout(fit,200));
  if("ResizeObserver" in window) new ResizeObserver(()=>fit()).observe($("map"));
}
let stopL;
function drawStopMarks(){
  if(!stopL) return; stopL.clear();
  RT.forEach(r=>ROUTES[r].stops.forEach(s=>{
    if(r==="park" && s.id==="church" && RT.includes("yatap")) return;
    stopL.add(s.lat,s.lng,`<div class="stopmk" style="border-color:${r==="park"?"#5EEAD4":"#93C5FD"}"><span class="stoplab">${esc(s.name)}</span></div>`,{z:2});
  }));
}
function drawMap(){
  if(!map) return; const seen={};
  RT.forEach(r=>liveBuses(r).forEach(b=>{
    const k=r+b.bus, html=pillHtml(r,b); seen[k]=1;
    if(!markers[k]){ markers[k]=busL.add(b.lat,b.lng,html,{z:10}); markers[k]._h=html; }
    else { markers[k].move(b.lat,b.lng); if(markers[k]._h!==html){ markers[k].html(html); markers[k]._h=html; } }
  }));
  Object.keys(markers).forEach(k=>{ if(!seen[k]){ markers[k].remove(); delete markers[k]; } });
}

// ---------- 안내판 ----------
function nextList(route,id,n){
  const {day,min}=nowKST();
  return scheduleFor(route,id,day).map(toM).filter(m=>m>=Math.floor(min)).sort((a,b)=>a-b).slice(0,n);
}
// 오늘 시간표: 지금 이후 출발 시각만
function drawTimes(){
  const {day,min}=nowKST(), port=document.body.classList.contains("portrait"), N=port?14:12;
  let h=`<h2>오늘 시간표<small>${DAYNAME[day]} · 지금 이후 출발</small></h2>`;
  RT.forEach(r=>{ const R=ROUTES[r];
    const rows = r==="yatap" ? [["byc","야탑역 BYC 앞 출발 → 교회"],["church","교회 출발 → 야탑역"]] : [["cdong","테크노파크 C동 출발 → 교회"]];
    h+=`<div class="ttr ${r}"><h3><i style="background:${R.color}"></i>${R.name}</h3><div class="ttls">`;
    rows.forEach(([id,lab])=>{ const l=nextList(r,id,N);
      const none = r==="park"&&day!==0 ? "주일에만 운행합니다" : scheduleFor(r,id,day).length ? "오늘 운행이 끝났습니다" : "오늘은 운행하지 않습니다";
      h+=`<div class="ttl"><span class="lab">${lab}</span><div class="chips">${l.length? l.map((m,k)=>`<b class="${k===0?'first':''}">${hhmm(m)}</b>`).join("") : `<span class="none">${none}</span>`}</div></div>`; });
    h+=`</div></div>`; });
  setH($("times"),h);
}
function drawBoards(){
  drawTimes();
  const {day,min}=nowKST();
  let h="";
  RT.forEach(r=>{
    const R=ROUTES[r], buses=liveBuses(r).filter(b=>!b.old);
    h+=`<section class="rt ${r}"><h2><i class="sw" style="background:${R.color}"></i>${R.name}<small>${buses.length? buses.length+"대 운행 중" : (r==="park"&&day!==0 ? "주일에만 운행" : "운행 중인 버스 없음")}</small></h2>`;
    R.stops.forEach(s=>{
      const le=liveEta(r,s), ns=nextList(r,s.id,1)[0];
      let eta;
      if(le && le.arrived) eta=`<div class="eta soon"><b>도착</b><span>${le.bus}호차가 와 있어요</span></div>`;
      else if(le) eta=`<div class="eta${le.eta<3?' soon':''}"><b>${le.eta<1?'곧 도착':`${Math.ceil(le.eta)}<small>분</small>`}</b><span>${le.bus}호차 · ${km(le.d)}</span></div>`;
      else if(ns!=null) eta=`<div class="eta sch"><b>${hhmm(ns)}</b><span>시간표 · ${inTxt(ns-min)}</span></div>`;
      else eta=`<div class="eta none"><b>운행 없음</b></div>`;
      h+=`<div class="stop"><div class="nm"><b>${esc(s.name)}</b><span>${rideDir(r,s.id)}</span></div>${eta}</div>`;
    });
    h+=`</section>`;
  });
  setH($("boards"),h);
}
function tickClock(){
  const {day,min}=nowKST(), d=new Date(serverNow()+9*3600e3);
  const H=d.getUTCHours(), M=d.getUTCMinutes();
  $("clk").textContent=`${H<12?'오전':'오후'} ${((H+11)%12)+1}:${String(M).padStart(2,"0")}`;
  $("clkDate").textContent=`${d.getUTCMonth()+1}월 ${d.getUTCDate()}일 ${DAYNAME[day]}`;
}

// ---------- 화면 켜 두기 · 전체 화면 ----------
let wake=null, idleT;
async function keepAwake(){ try{ if("wakeLock" in navigator && document.visibilityState==="visible") wake=await navigator.wakeLock.request("screen"); }catch(_){} }
document.addEventListener("visibilitychange",()=>{ if(!document.hidden) keepAwake(); });
$("fsBtn").onclick=async()=>{ try{ await document.documentElement.requestFullscreen(); }catch(_){} keepAwake(); };
const wakeUp=()=>{ document.body.classList.remove("idle"); clearTimeout(idleT); idleT=setTimeout(()=>document.body.classList.add("idle"),4000); };
["mousemove","touchstart","keydown"].forEach(ev=>document.addEventListener(ev,wakeUp,{passive:true})); wakeUp();
// 새 버전 반영과 메모리 정리를 위해 6시간마다 새로고침
setTimeout(()=>location.reload(), 6*3600e3);

// ---------- QR (성도님 주소) ----------
try{
  const url=location.origin+location.pathname.replace(/[^/]*$/,"");
  const q=qrcode(0,"M"); q.addData(url); q.make();
  $("qr").innerHTML=`<img src="${q.createDataURL(8,0)}" alt="" style="width:100%;height:100%;image-rendering:pixelated">`;
}catch(_){ $("qr").classList.add("hide"); }

// ---------- 시작 ----------
(async()=>{
  await initMap();
  onValue(ref(db,"live"), s=>{ const v=s.val()||{}; LIVE={yatap:v.yatap||{},park:v.park||{}}; drawMap(); drawBoards(); });
  onValue(ref(db,"config"), s=>{ const c=s.val()||{};
    if(applyStops(c.stops)) drawStopMarks();
    PARK_TIMES=parseTimes(c.parkTimes); TIMES=c.times||{};
    const n=c.notice, show=n&&n.on&&n.text; $("notice").classList.toggle("hide",!show);
    if(show) $("notice").innerHTML=`<span aria-hidden="true">📢</span><span>${esc(n.text)}</span>`;
    $("boards")._h=null; drawBoards(); });
  setInterval(()=>{ drawMap(); drawBoards(); },4000);
  tickClock(); setInterval(tickClock,1000);
  keepAwake();
})();
